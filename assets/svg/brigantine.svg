<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- water -->
  <ellipse cx="80" cy="109" rx="68" ry="8" fill="#1565c0" opacity="0.35"/>
  <!-- hull - wider, two decks -->
  <path d="M12 60 Q80 80 148 60 L138 90 Q80 106 22 90 Z" fill="#6b3e1e" stroke="#3a1e08" stroke-width="2"/>
  <!-- upper deck line -->
  <line x1="22" y1="67" x2="138" y2="67" stroke="#8b5e30" stroke-width="2"/>
  <!-- gun ports row 1 -->
  <rect x="28" y="70" width="12" height="7" fill="#222" rx="1"/>
  <circle cx="30" cy="73.5" r="2.5" fill="#111"/>
  <rect x="50" y="70" width="12" height="7" fill="#222" rx="1"/>
  <circle cx="52" cy="73.5" r="2.5" fill="#111"/>
  <rect x="98" y="70" width="12" height="7" fill="#222" rx="1"/>
  <circle cx="110" cy="73.5" r="2.5" fill="#111"/>
  <rect x="120" y="70" width="12" height="7" fill="#222" rx="1"/>
  <circle cx="130" cy="73.5" r="2.5" fill="#111"/>
  <!-- foremast -->
  <rect x="54" y="6" width="5" height="60" fill="#4a2e0e" rx="1"/>
  <!-- mainmast -->
  <rect x="98" y="10" width="5" height="58" fill="#4a2e0e" rx="1"/>
  <!-- fore sail -->
  <path d="M59 8 L100 40 L59 66 Z" fill="#f0e8cc" stroke="#c8a060" stroke-width="1.5" opacity="0.9"/>
  <!-- main sail -->
  <path d="M103 12 L140 48 L103 68 Z" fill="#ede5c8" stroke="#c8a060" stroke-width="1.5" opacity="0.9"/>
  <!-- jib -->
  <path d="M54 10 L14 54 L54 62 Z" fill="#e8e0c0" stroke="#c8a060" stroke-width="1" opacity="0.85"/>
  <!-- flags -->
  <path d="M59 6 L80 13 L59 20 Z" fill="#e53935"/>
  <path d="M103 10 L122 17 L103 24 Z" fill="#e53935"/>
  <!-- captain -->
  <circle cx="80" cy="57" r="6" fill="#f5deb3" stroke="#3a1e08" stroke-width="1"/>
  <rect x="74" y="62" width="12" height="9" fill="#1a237e" rx="1"/>
  <path d="M73 57 L87 57 L84 49 L76 49 Z" fill="#111"/>
</svg>
